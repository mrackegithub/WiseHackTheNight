name: ci
on:
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    # API tests (B/C) use a real database; same credentials as docker-compose.yml / apps/api/.env.example.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: sgm
          POSTGRES_PASSWORD: sgm
          POSTGRES_DB: sgm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sgm:sgm@localhost:5432/sgm
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ownership
        run: bash scripts/check-ownership.sh origin/main
      - run: pnpm -r install
      - name: Contract is valid and generated types are fresh
        run: |
          pnpm contract:lint
          pnpm contract:gen
          git diff --exit-code packages/contracts/src/generated.ts
      - name: Apply database migrations
        run: pnpm --filter @sgm/api exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm test
